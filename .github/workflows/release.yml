name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm uploading to PyPI'
        required: true

permissions:
  id-token: write

jobs:
  guard:
    name: Confirm publish intent
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo 'Confirmation input must be exactly "publish".' >&2
            exit 1
          fi

  wheels:
    name: Build wheel (${{ matrix.target }} on ${{ matrix.os }})
    needs: [guard]
    runs-on: ${{ matrix.os }}
    env:
      # Override .cargo/config.toml target-cpu=native so wheels are portable
      # (native SIMD is correct for local dev but wrong for distribution)
      RUSTFLAGS: ""
    strategy:
      # Report every wheel target, not just the first to fail. The default
      # cancelled four of five targets the moment Windows failed, hiding
      # whether the others would have built.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: macos-13
            target: x86_64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # No --no-sdist: maturin dropped that flag, and `maturin build` no
          # longer produces an sdist anyway. Passing it aborted every wheel
          # target with "unexpected argument" before any compilation started.
          #
          # --find-interpreter is required for the Linux targets. Those build
          # inside the manylinux container, which keeps its interpreters under
          # /opt/python/* and puts none of them on PATH, so maturin's default
          # search failed with "Couldn't find any python interpreters from
          # 'python3'". macOS and Windows build natively and find the runner's
          # own interpreter, which is why only Linux failed.
          args: --release --out dist --find-interpreter
          manylinux: auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build sdist
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
